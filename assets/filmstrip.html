<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bag of Rocks filmstrip</title>
<!--
  Template for bag-of-rocks. To use: copy this file into the run folder,
  replace the JSON inside the "run-data" script element with the run's data
  (schema in references/review-and-report.md), and keep screenshots at
  the relative paths the JSON names (or use data: URIs).
  Steps with an empty "screenshot" render a labeled placeholder.
-->
<style>
/* Evidence ledger: system fonts, one spacing scale, shared report primitives. */
:root{
  color-scheme:light dark;
  --bg:light-dark(#f6f7f8,#191d21);--surface:light-dark(#fff,#20262c);
  --ink:light-dark(#252a30,#e3e8ed);--muted:light-dark(#58616b,#b2bdc8);
  --line:light-dark(#bac2cb,#4f5c67);--accent:light-dark(#294f70,#b4d4f0);
  --accent-ink:light-dark(#fff,#191d21);--tint:light-dark(#e9edf1,#28323b);
  --bad:light-dark(#a02d27,#ffaaa4);--warn:light-dark(#77500d,#edc47e);
  --alt:var(--accent);--hatch:light-dark(#58616b30,#b2bdc830);
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --space:8px;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1080px;margin:auto;padding:max(32px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(64px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));overflow-wrap:anywhere}
h1,h2,h3{line-height:1.2;font-weight:600;text-wrap:balance}
h1{font-size:clamp(1.8rem,4vw,2.75rem);letter-spacing:-.035em;margin:16px 0;max-width:28ch}
h2{font-size:1.4rem;letter-spacing:-.02em;margin:40px 0 16px}
h3{font-size:1.1rem;margin:8px 0 16px}
p{margin:0 0 16px}
a{color:var(--accent);text-underline-offset:.2em}
.meta,.label,.tag,.step-id{font: .8125rem/1.6 var(--mono);color:var(--muted)}
header .meta{max-width:90ch}
.label{margin:0 0 16px}
.card{padding:16px 0}
.outcome{display:grid;gap:24px;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);margin-top:24px}
.outcome .label{margin-bottom:8px}
.outcome .card{min-width:0}
.chip{display:inline-block;font: .8125rem/1.6 var(--mono);margin:0 12px 4px 0}
.k-unrecovered,.c-breakage{color:var(--bad)}
.k-recovered,.c-misleading{color:var(--warn)}
.k-alternate,.c-confusion{color:var(--alt)}
.summary{padding:0 0 0 24px;max-width:75ch}
.summary li{padding:0 0 8px 8px}
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.rail .card{border-top:1px solid var(--line);font-size:.875rem}
.step{display:grid;grid-template-columns:72px minmax(0,1fr);gap:24px;padding:24px 0;margin:0}
.step-id{color:var(--accent);padding-top:4px;font-variant-numeric:tabular-nums}
.step-body{border-left:1px solid var(--line);padding-left:24px;min-width:0}
.step .label{margin:16px 0}
.shot{position:relative;border:1px solid var(--line);background:var(--surface)}
.shot img{display:block;width:100%;height:auto}
.ph{min-height:180px;display:grid;place-items:center;padding:24px;color:var(--muted);font-size:.875rem}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pair figure{margin:0;min-width:0}
.pair figcaption{margin:0 0 8px}
.click{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 .8rem/1 var(--mono);display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface)}
.click .rep{position:absolute;top:-12px;right:-18px;background:var(--surface);color:var(--bad);padding:3px;border:1px solid var(--bad)}
.click.approx{background:var(--surface);color:var(--accent);border:2px dashed var(--accent);box-shadow:none}
.ignored{position:absolute;border:2px dashed var(--muted);background:repeating-linear-gradient(45deg,var(--hatch) 0 6px,transparent 6px 12px)}
.ignored span{position:absolute;bottom:100%;left:0;max-width:100%;font-size:.75rem;background:var(--surface);color:var(--ink);padding:0 4px}
.bubble{border-left:3px solid var(--accent);padding:0 0 0 16px;margin:24px 0;font-size:1.125rem;max-width:65ch}
.bubble::before{content:"Expects";display:block;font:.8125rem/1.6 var(--mono);color:var(--muted);margin-bottom:4px}
dl{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--space) 16px;max-width:85ch}
dt{font:.8125rem/1.8 var(--mono);color:var(--muted)}dd{margin:0;min-width:0}
.verdicts,.toolbar{display:flex;flex-wrap:wrap;gap:var(--space);margin-top:24px}
.verdicts button,.btn{font:inherit;font-size:.875rem;min-height:44px;padding:var(--space) 12px;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.verdicts button:hover,.btn:hover{border-color:var(--accent);background:var(--tint)}
.verdicts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.verdicts button:active,.btn:active{box-shadow:inset 0 0 0 1px currentColor}
.step.wait .bubble{display:none}
.step.wait .step-body,.step.reviewer .step-body{border-left-style:dashed}
.harness,.untested{color:var(--warn);margin-top:16px}
.entered{font-family:var(--mono);font-size:.875rem;background:var(--tint);padding:2px 4px}
.finding{border-top:1px solid var(--line);margin-top:24px}
ul.card{padding-left:24px;max-width:85ch}
.toolbar{border-top:1px solid var(--line);padding-top:24px;align-items:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:680px){
 main{padding:24px 16px 48px}.outcome,.pair{grid-template-columns:1fr}.outcome{gap:0}
 .outcome .card+.card{border-top:1px solid var(--line)}
 .step{grid-template-columns:1fr;gap:var(--space)}.step-body{padding-left:16px}
 dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:12px}
}
@media print{
 :root{color-scheme:light}body{background:#fff}main{max-width:none;padding:0;font-size:11pt}
 .verdicts,.toolbar{display:none}.step{grid-template-columns:48px minmax(0,1fr)}
 .pair{grid-template-columns:repeat(2,minmax(0,1fr))}h2,h3,dt{break-after:avoid}
 figure,.shot,.outcome{break-inside:avoid}a{color:inherit}.step-body{border-color:var(--line)}
}
</style>
</head>
<body>
<main id="app"></main>

<script id="run-data" type="application/json">
{
  "run": {"id":"demo-run","date":"2026-10-27","goal":"Change my mailing address to 12 Elm St.","start":"https://staging.example.test/","preset":"full-bag","traits":["VPF","HTS","FC:3","LIT","NR","LP"],"phrasing":"own-words","entered_text":"","mutations":"allowed","conditions":["slow-network"],"perception":"mixed","mode":"fast","skill_version":"0.5.0"},
  "outcome": {"believed":"Address updated (saw a green check)","supported":"uncertain","gap":"Check appeared, but the address shown still read the old value."},
  "summary": [
    {"finding":"F1","headline":"Save gives no feedback for several seconds, so the rock clicked it 4 times.","step":"C2"}
  ],
  "intended": [
    {"id":"I1","screen":"Account","cue":"Edit beside Mailing address","action":"Open editor"},
    {"id":"I2","screen":"Address editor","cue":"Save button","action":"Enter address, Save"}
  ],
  "steps": [
    {"id":"C1","kind":"checkpoint","screenshot":"","result_screenshot":"","cue":"Large blue 'Update profile' card","expectation":"This is where I change my info","action":"Clicked the card","result":"Opened a photo and bio editor","updated":"Wrong place; go back","traits":["VPF"],"clicks":[{"x":60,"y":45,"n":1,"approx":false}],"ignored":[{"x":6,"y":70,"w":30,"h":7,"label":"Edit (mailing address)"}],"divergence":{"from":"I1","kind":"recovered","note":"2 backtracks"}},
    {"id":"C2","kind":"checkpoint","screenshot":"","cue":"Save, nothing changed after clicking","expectation":"It didn't take; click again","action":"Clicked Save","result":"No change, then a green check","updated":"Probably saved","traits":["FC"],"clicks":[{"x":78,"y":82,"n":4,"approx":true}],"ignored":[{"x":6,"y":55,"w":50,"h":6,"label":"Hint: use ZIP+4"}],"harness_note":"Click went through an accessibility target; marker position is approximate."},
    {"id":"W1","kind":"wait","screenshot":"","cue":"Spinner, no visible change","result":"Still spinning after 20s","traits":["ordinary"]},
    {"id":"END","kind":"reviewer","screenshot":"","cue":"Reviewer-added end card","result":"Rock stopped believing the address was saved."}
  ],
  "findings": [
    {"id":"F1","source":"rock-exposed","recurs_in":[],"category":"breakage","title":"Save stays enabled with no loading state","steps":["C2"],"traits":["FC"],"component":"Button (loading state)","component_basis":"inferred","expected":"Clicking Save shows something happening","observed":"Nothing for several seconds; 4 clicks","cost":"Possible duplicate updates","fix":"Show a loading state and block repeat clicks while saving","fix_signal":"One request per Save under slow-network","regression_risk":"Button stuck disabled after validation errors","ablation":"Rerun without Fidget Clicker: if no duplicates, repeat clicks were the trigger."}
  ],
  "errata": [],
  "limits": ["Demo data only.","Synthetic run: generates hypotheses about blind spots, not evidence of how many real users would fail."]
}
</script>

<script>
(function(){
  // Set by trace_to_run.py --filmstrip --calibration; ordinary reports stay read-only.
  const CALIBRATION = false;
  const R = JSON.parse(document.getElementById('run-data').textContent);
  const r = R.run || {};
  const KEY = 'bag-of-rocks-calibration:' + (r.id || 'run');
  let verdicts = {};
  if (CALIBRATION) try { verdicts = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { verdicts = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(verdicts)); return true; } catch (e) { return false; } };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const arr = v => Array.isArray(v) ? v : (v ? String(v).split(/,\s*/) : []);
  const traitsOf = s => arr(s.traits ?? s.trait);
  const catCls = c => c === 'breakage' ? 'c-breakage' : c === 'misleading feedback' ? 'c-misleading' : 'c-confusion';

  let h = `<header><p class="label">Bag of Rocks filmstrip · ${esc(r.id)} · ${esc(r.date)} · skill ${esc(r.skill_version || '')}</p>`;
  h += `<h1>${esc(r.goal)}</h1>`;
  h += `<p class="meta">${esc(r.start)} · preset ${esc(r.preset)} [${arr(r.traits).map(esc).join(', ')}] · phrasing ${esc(r.phrasing || 'own-words')} · mutations ${esc(r.mutations)} · conditions ${esc(arr(r.conditions).join(', ') || 'none')} · perception ${esc(r.perception)} · mode ${esc(r.mode)}</p>`;
  if (r.inherited_state) h += `<p class="meta">Inherited state: ${esc(r.inherited_state)}</p>`;
  if (r.entered_text) h += `<p class="meta">Rock entered: <span class="entered">${esc(r.entered_text)}</span></p>`;
  h += `</header>`;

  const o = R.outcome || {};
  h += `<section class="outcome">
    <div class="card"><div class="label">Rock believed</div>${esc(o.believed)}</div>
    <div class="card"><div class="label">Evidence supports</div><strong>${esc(o.supported)}</strong></div>
    <div class="card"><div class="label">Gap</div>${esc(o.gap || 'None noted')}</div></section>`;

  if ((R.summary||[]).length) h += `<h2>In 90 seconds</h2><ol class="summary card">` + R.summary.map(s =>
    `<li>${esc(s.headline)} <a href="#step-${esc(s.step)}">See ${esc(s.step)}</a></li>`).join('') + `</ol>`;

  if ((R.intended||[]).length) h += `<h2>Intended path (hidden from the rock)</h2><div class="rail">` + R.intended.map(i =>
    `<div class="card"><strong>${esc(i.id)} · ${esc(i.screen)}</strong><br>${esc(i.cue)}<br><span class="meta">${esc(i.action)}</span></div>`).join('') + `</div>`;

  const shot = (src, alt, overlays) => `<div class="shot">${src ? `<img src="${esc(src)}" alt="${esc(alt)}">` : `<div class="ph">${esc(alt)}</div>`}${overlays || ''}</div>`;

  h += `<h2>Filmstrip</h2>`;
  let n = 0;
  (R.steps||[]).forEach(s => {
    const kind = s.kind || 'checkpoint';
    if (kind === 'checkpoint') n++;
    const clicks = s.clicks || [];
    const marks = clicks.map((c, j) =>
      `<div class="click${c.approx ? ' approx' : ''}" style="left:${+c.x}%;top:${+c.y}%" aria-hidden="true">${n}${clicks.length>1?'.'+(j+1):''}${c.n>1?`<span class="rep">×${+c.n}</span>`:''}</div>`).join('');
    const ign = (s.ignored||[]).map(g =>
      `<div class="ignored" style="left:${+g.x}%;top:${+g.y}%;width:${+g.w}%;height:${+g.h}%" aria-hidden="true"><span>not read: ${esc(g.label)}</span></div>`).join('');
    const before = shot(s.screenshot, `Screenshot ${s.id}${s.cue ? ': ' + s.cue : ''}`, ign + marks);
    const visual = s.result_screenshot
      ? `<div class="pair"><figure><figcaption class="tag">Before</figcaption>${before}</figure><figure><figcaption class="tag">After</figcaption>${shot(s.result_screenshot, 'Result of ' + s.id, '')}</figure></div>`
      : before;
    const d = s.divergence;
    const dv = d ? `<p><span class="chip k-${esc(d.kind)}">${esc(d.kind)} divergence from ${esc(d.from)}</span> <span class="meta">${esc(d.note)}</span></p>` : '';
    const clickText = clicks.map(c => `(${+c.x}%, ${+c.y}%)${c.n>1?' ×'+(+c.n):''}${c.approx?' approx':''}`).join(', ');
    const ignText = (s.ignored||[]).map(g => esc(g.label)).join('; ');
    const head = kind === 'wait' ? `Wait · ${esc(s.id)}` : kind === 'correction' ? `Tester correction to ${esc(s.corrects)} · ${esc(s.id)}` : kind === 'reviewer' ? `Reviewer-added · ${esc(s.id)}` : `Step ${n} · ${esc(s.id)}`;
    h += `<article class="step card ${kind}" id="step-${esc(s.id)}">
      <div class="step-id">${esc(s.id)}</div>
      <div class="step-body">
        ${visual}
        <p class="label">${head}${traitsOf(s).length ? ' · ' + traitsOf(s).map(t => `<span class="chip">${esc(t)}</span>`).join(' ') : ''}</p>
        ${dv}
        ${s.expectation ? `<div class="bubble">${esc(s.expectation)}</div>` : ''}
        <dl>
          ${s.cue ? `<dt>Cue</dt><dd>${esc(s.cue)}</dd>` : ''}
          ${s.action ? `<dt>Action</dt><dd>${esc(s.action)}${clickText ? ` <span class="meta">at ${clickText}</span>` : ''}</dd>` : ''}
          ${s.entered_text ? `<dt>Entered</dt><dd><span class="entered">${esc(s.entered_text)}</span></dd>` : ''}
          ${s.result ? `<dt>Result</dt><dd>${esc(s.result)}</dd>` : ''}
          ${s.updated ? `<dt>Then</dt><dd>${esc(s.updated)}</dd>` : ''}
          ${s.note ? `<dt>Note</dt><dd>${esc(s.note)}</dd>` : ''}
          ${ignText ? `<dt>Not read</dt><dd>${ignText}</dd>` : ''}
        </dl>
        ${s.harness_note ? `<p class="harness">Harness: ${esc(s.harness_note)}</p>` : ''}
        ${s.untested ? `<p class="untested">Untested commit (mutations: none): recorded as intent only.</p>` : ''}
        ${CALIBRATION ? `<p class="label">Tester calibration</p><div class="verdicts" role="group" aria-label="Tester calibration for ${esc(s.id)}">
          ${['Plausible','Too expert','Overplayed confusion','Unmotivated action'].map(v => `<button type="button" aria-pressed="${verdicts[s.id]===v}" data-step="${esc(s.id)}" data-v="${v}">${v}</button>`).join('')}
        </div>` : ''}
      </div></article>`;
  });

  if ((R.findings||[]).length) h += `<h2>Findings</h2>` + R.findings.map(f => `<div class="finding card" id="finding-${esc(f.id)}">
      <span class="chip ${catCls(f.category)}">${esc(f.category)}</span>
      ${f.source ? `<span class="chip">${esc(f.source)}</span>` : ''}
      ${arr(f.recurs_in).length ? `<span class="chip">also in ${arr(f.recurs_in).map(esc).join(', ')}</span>` : ''}
      <h3>${esc(f.id)} · ${esc(f.title)}</h3>
      <dl>
        <dt>Steps</dt><dd>${arr(f.steps).map(x => `<a href="#step-${esc(x)}">${esc(x)}</a>`).join(', ')}</dd>
        <dt>Traits</dt><dd>${arr(f.traits ?? f.trait).map(esc).join(', ')}</dd>
        ${f.component ? `<dt>Component</dt><dd>${esc(f.component)} <span class="meta">(${esc(f.component_basis || 'inferred')})</span></dd>` : ''}
        <dt>Expected</dt><dd>${esc(f.expected)}</dd>
        <dt>Observed</dt><dd>${esc(f.observed)}</dd>
        <dt>Cost</dt><dd>${esc(f.cost)}</dd>
        <dt>Smallest fix</dt><dd>${esc(f.fix)}</dd>
        <dt>Signal it worked</dt><dd>${esc(f.fix_signal)}</dd>
        <dt>Watch for</dt><dd>${esc(f.regression_risk)}</dd>
        ${f.ablation ? `<dt>Ablation</dt><dd>${esc(f.ablation)}</dd>` : ''}
      </dl></div>`).join('');

  if ((R.limits||[]).length) h += `<h2>Limits</h2><ul class="card">` + R.limits.map(l => `<li>${esc(l)}</li>`).join('') + `</ul>`;
  if ((R.errata||[]).length) h += `<h2>Errata (append-only)</h2><ul class="card">` + R.errata.map(x => `<li><strong>${esc(x.date)} · ${esc(x.about)}:</strong> ${esc(x.correction)}</li>`).join('') + `</ul>`;

  if (CALIBRATION) h += `<div class="toolbar" aria-label="Tester calibration exports">
    <button class="btn" id="export">Download verdicts (JSON)</button>
    <button class="btn" id="copy">Copy verdicts</button>
    <button class="btn" id="clear">Clear verdicts</button>
    <span class="meta" id="status" role="status"></span></div>`;

  document.getElementById('app').innerHTML = h;
  document.title = 'Bag of Rocks · ' + (r.goal || r.id || 'filmstrip');
  if (!CALIBRATION) return;

  const status = msg => { document.getElementById('status').textContent = msg; };
  const count = () => Object.keys(verdicts).length;
  status(save() ? (count() ? `${count()} verdicts restored from this browser.` : 'Verdicts save automatically in this browser.') : 'This browser can’t save verdicts; export before closing.');

  document.querySelectorAll('.verdicts button').forEach(b => b.addEventListener('click', () => {
    const step = b.dataset.step;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
    if (verdicts[step] === b.dataset.v) delete verdicts[step];
    else { verdicts[step] = b.dataset.v; b.setAttribute('aria-pressed', 'true'); }
    status(save() ? `${count()} verdicts saved in this browser.` : 'Not saved; export before closing.');
  }));

  const payload = () => JSON.stringify({ run: r.id, skill_version: r.skill_version || '', exported: new Date().toISOString(),
    verdicts: (R.steps||[]).filter(s => verdicts[s.id]).map(s => ({ step: s.id, kind: s.kind || 'checkpoint', traits: traitsOf(s), verdict: verdicts[s.id] })) }, null, 2);

  document.getElementById('export').addEventListener('click', () => {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([payload()], { type: 'application/json' }));
      a.download = `verdicts-${r.id || 'run'}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      status('Downloaded.');
    } catch (e) { status('Download unavailable here; use Copy.'); }
  });
  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(payload()); status('Copied.'); } catch (e) { status('Clipboard unavailable.'); }
  });
  document.getElementById('clear').addEventListener('click', () => {
    verdicts = {}; save();
    document.querySelectorAll('.verdicts button').forEach(x => x.setAttribute('aria-pressed', 'false'));
    status('Verdicts cleared.');
  });
})();
</script>
</body>
</html>
